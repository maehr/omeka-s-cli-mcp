name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.11", "3.12", "3.13", "3.14", "3.15"]
        include:
          - os: macos-latest
            python: "3.13"
          - os: windows-latest
            python: "3.13"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.13.9"
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: uv run --locked prek run --all-files

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.13.9"
          python-version: "3.11"
      - run: uv build
      - name: Check optional dependencies
        run: |
          wheel=$(printf '%s' dist/*.whl)
          core="${RUNNER_TEMP}/omeka-core"
          cli="${RUNNER_TEMP}/omeka-cli"
          mcp="${RUNNER_TEMP}/omeka-mcp"

          uv venv "$core"
          uv pip install --python "$core/bin/python" "$wheel"
          "$core/bin/python" -I -c 'import omeka_s_client; from importlib.util import find_spec; assert all(find_spec(name) is None for name in ("typer", "pydantic_settings", "fastmcp"))'

          uv venv "$cli"
          uv pip install --python "$cli/bin/python" "${wheel}[cli]"
          "$cli/bin/omeka-s" --help
          "$cli/bin/python" -I -c 'from importlib.util import find_spec; assert find_spec("fastmcp") is None'

          uv venv "$mcp"
          uv pip install --python "$mcp/bin/python" "${wheel}[mcp]"
          "$mcp/bin/omeka-s" --help
          "$mcp/bin/omeka-s-mcp" --help

  playground:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.13.9"
          python-version: "3.13"
      - run: uv build
      - run: sh playground/build.sh
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - run: npm install --no-save pyodide@314.0.8
      - run: node playground/smoke.mjs

  quality-gate:
    name: quality-gate
    runs-on: ubuntu-latest
    if: ${{ always() }}
    needs: [test, package, playground]
    steps:
      - env:
          TEST: ${{ needs.test.result }}
          PACKAGE: ${{ needs.package.result }}
          PLAYGROUND: ${{ needs.playground.result }}
        run: test "$TEST" = success && test "$PACKAGE" = success && test "$PLAYGROUND" = success
