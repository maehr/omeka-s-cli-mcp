name: Omeka Integration

on:
  workflow_dispatch:
  schedule:
    - cron: "30 3 * * 1"

permissions:
  contents: read

jobs:
  omeka:
    name: Omeka S ${{ matrix.omeka }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        omeka: ["3.2.3", "4.1.1", "4.2.1"]
    env:
      OMEKA_VERSION: ${{ matrix.omeka }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.13.9"
          python-version: "3.11"
      - run: uv sync --locked
      - run: uv run --locked python tests/integration/run.py
